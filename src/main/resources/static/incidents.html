<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Incidents - Neighborhood Watch</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f1f5f9;
            min-height: 100vh;
        }

        header {
            background: #0f172a;
            color: white;
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 24px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .role {
            background: #2563eb;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
        }

        .logout-btn {
            background: #dc2626;
            color: white;
            border: none;
            padding: 9px 15px;
            border-radius: 7px;
            cursor: pointer;
        }

        .logout-btn:hover {
            background: #b91c1c;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 30px auto;
        }

        .top-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .top-section h2 {
            color: #0f172a;
        }

        .report-btn {
            background: #2563eb;
            color: white;
            text-decoration: none;
            padding: 11px 18px;
            border-radius: 8px;
            font-weight: bold;
        }

        .report-btn:hover {
            background: #1d4ed8;
        }

        #message {
            text-align: center;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .incident-card {
            background: white;
            padding: 22px;
            margin-bottom: 18px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
        }

        .incident-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .incident-header h3 {
            color: #0f172a;
        }

        .status {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            background: #fef3c7;
            color: #92400e;
        }

        .incident-info {
            margin: 8px 0;
            color: #475569;
        }

        .description {
            margin-top: 12px;
            color: #334155;
            line-height: 1.5;
        }

        .admin-controls {
            margin-top: 18px;
            padding-top: 15px;
            border-top: 1px solid #e2e8f0;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        select {
            padding: 9px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
        }

        .update-btn {
            background: #16a34a;
            color: white;
            border: none;
            padding: 9px 14px;
            border-radius: 7px;
            cursor: pointer;
        }

        .update-btn:hover {
            background: #15803d;
        }

        .delete-btn {
            background: #dc2626;
            color: white;
            border: none;
            padding: 9px 14px;
            border-radius: 7px;
            cursor: pointer;
        }

        .delete-btn:hover {
            background: #b91c1c;
        }

        .no-incidents {
            background: white;
            padding: 40px;
            text-align: center;
            border-radius: 12px;
            color: #64748b;
        }

    </style>

</head>


<body>


<header>

    <h1>🏘️ Neighborhood Watch</h1>

    <div class="user-info">

        <span id="userName"></span>

        <span id="userRole" class="role"></span>

        <button class="logout-btn" onclick="logout()">
            Logout
        </button>

    </div>

</header>


<div class="container">


    <div class="top-section">

        <h2>Reported Incidents</h2>

        <a href="report.html" class="report-btn">
            + Report Incident
        </a>

    </div>


    <div id="message"></div>


    <div id="incidentsContainer">

        <div class="no-incidents">
            Loading incidents...
        </div>

    </div>


</div>


<script>


    // Get logged-in user information

    const userName =
        sessionStorage.getItem("userName");

    const userRole =
        sessionStorage.getItem("userRole");


    // Check login

    if (!userName || !userRole) {

        window.location.href = "login.html";

    }


    // Display user information

    document.getElementById("userName").textContent =
        userName;

    document.getElementById("userRole").textContent =
        userRole;


    // Load incidents

    function loadIncidents() {

        fetch("/incidents")

            .then(async response => {

                if (!response.ok) {

                    throw new Error(
                        "Unable to load incidents"
                    );

                }

                return response.json();

            })

            .then(incidents => {

                const container =
                    document.getElementById(
                        "incidentsContainer"
                    );

                container.innerHTML = "";


                if (incidents.length === 0) {

                    container.innerHTML = `
                        <div class="no-incidents">
                            No incidents reported yet.
                        </div>
                    `;

                    return;

                }


                incidents.forEach(incident => {

                    const card =
                        document.createElement("div");

                    card.className =
                        "incident-card";


                    card.innerHTML = `

                        <div class="incident-header">

                            <h3>
                                ${incident.title}
                            </h3>

                            <span class="status">
                                ${incident.status}
                            </span>

                        </div>


                        <div class="incident-info">
                            📍 Location:
                            ${incident.location}
                        </div>


                        <div class="incident-info">
                            🚨 Type:
                            ${incident.incidentType}
                        </div>


                        <div class="description">
                            ${incident.description}
                        </div>

                    `;


                    // ADMIN controls

                    if (userRole === "ADMIN") {

                        const controls =
                            document.createElement("div");

                        controls.className =
                            "admin-controls";


                        controls.innerHTML = `

                            <select id="status-${incident.incidentId}">

                                <option value="Pending">
                                    Pending
                                </option>

                                <option value="In Progress">
                                    In Progress
                                </option>

                                <option value="Resolved">
                                    Resolved
                                </option>

                                <option value="Rejected">
                                    Rejected
                                </option>

                            </select>


                            <button
                                class="update-btn"
                                onclick="updateStatus(${incident.incidentId})">

                                Update Status

                            </button>


                            <button
                                class="delete-btn"
                                onclick="deleteIncident(${incident.incidentId})">

                                Delete

                            </button>

                        `;


                        card.appendChild(controls);

                    }


                    container.appendChild(card);

                });

            })

            .catch(error => {

                console.error(error);

                document.getElementById(
                    "incidentsContainer"
                ).innerHTML = `

                    <div class="no-incidents">

                        Unable to load incidents.
                        Please login again.

                    </div>

                `;

            });

    }


    // Update incident status

    function updateStatus(id) {

        const status =
            document.getElementById(
                "status-" + id
            ).value;


        fetch(
            `/incidents/${id}?status=${encodeURIComponent(status)}`,
            {
                method: "PUT"
            }
        )

        .then(async response => {

            if (!response.ok) {

                throw new Error(
                    "Unable to update status"
                );

            }

            return response.json();

        })

        .then(() => {

            showMessage(
                "Incident status updated successfully!",
                "green"
            );

            loadIncidents();

        })

        .catch(error => {

            console.error(error);

            showMessage(
                "You are not authorized to update incidents.",
                "red"
            );

        });

    }


    // Delete incident

    function deleteIncident(id) {

        const confirmDelete =
            confirm(
                "Are you sure you want to delete this incident?"
            );


        if (!confirmDelete) {
            return;
        }


        fetch(`/incidents/${id}`, {

            method: "DELETE"

        })

        .then(async response => {

            if (!response.ok) {

                throw new Error(
                    "Unable to delete incident"
                );

            }

            return response.text();

        })

        .then(() => {

            showMessage(
                "Incident deleted successfully!",
                "green"
            );

            loadIncidents();

        })

        .catch(error => {

            console.error(error);

            showMessage(
                "You are not authorized to delete incidents.",
                "red"
            );

        });

    }


    // Show message

    function showMessage(text, color) {

        const message =
            document.getElementById("message");

        message.textContent = text;

        message.style.color = color;


        setTimeout(() => {

            message.textContent = "";

        }, 3000);

    }


    // Logout

    function logout() {

        sessionStorage.clear();

        window.location.href =
            "login.html";

    }


    // Load incidents when page opens

    loadIncidents();


</script>


</body>

</html>
