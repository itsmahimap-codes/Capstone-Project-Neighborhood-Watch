<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Incidents - Neighborhood Watch</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">

        <a class="navbar-brand fw-bold" href="index.html">
            🛡️ Neighborhood Watch
        </a>

        <div>
            <a href="report.html" class="btn btn-danger me-2">
                🚨 Report Incident
            </a>

            <a href="index.html" class="btn btn-outline-light">
                Home
            </a>
        </div>

    </div>
</nav>


<div class="container py-5">

    <div class="text-center mb-5">

        <h1 class="fw-bold">
            📋 Reported Incidents
        </h1>

        <p class="text-muted">
            View incidents reported in the neighborhood.
        </p>

    </div>


    <div id="incidentList" class="row g-4">

        <div class="text-center">
            <div class="spinner-border"></div>
            <p class="mt-2">Loading incidents...</p>
        </div>

    </div>

</div>


<script>

function loadIncidents() {

    fetch("/incidents")

        .then(response => {

            if (!response.ok) {
                throw new Error("Failed to load incidents");
            }

            return response.json();

        })

        .then(incidents => {

            const container = document.getElementById("incidentList");

            container.innerHTML = "";

            if (incidents.length === 0) {

                container.innerHTML = `
                    <div class="col-12 text-center">
                        <div class="alert alert-info">
                            No incidents have been reported yet.
                        </div>
                    </div>
                `;

                return;
            }


            incidents.forEach(incident => {

                let statusClass = "bg-warning text-dark";

                if (incident.status === "Resolved") {
                    statusClass = "bg-success";
                }

                if (incident.status === "In Progress") {
                    statusClass = "bg-primary";
                }

                if (incident.status === "Rejected") {
                    statusClass = "bg-danger";
                }


                container.innerHTML += `

                    <div class="col-md-6 col-lg-4">

                        <div class="card shadow-sm h-100">

                            <div class="card-body">

                                <div class="d-flex justify-content-between">

                                    <h5 class="card-title fw-bold">
                                        ${incident.title}
                                    </h5>

                                    <span class="badge ${statusClass}">
                                        ${incident.status}
                                    </span>

                                </div>

                                <hr>

                                <p>
                                    <strong>Type:</strong>
                                    ${incident.incidentType}
                                </p>

                                <p>
                                    <strong>Location:</strong>
                                    ${incident.location}
                                </p>

                                <p class="text-muted">
                                    ${incident.description}
                                </p>

                            </div>

                        </div>

                    </div>

                `;

            });

        })

        .catch(error => {

            document.getElementById("incidentList").innerHTML = `

                <div class="col-12">

                    <div class="alert alert-danger text-center">

                        Unable to load incidents.
                        Please make sure the Spring Boot server is running.

                    </div>

                </div>

            `;

        });

}


loadIncidents();

</script>

</body>
</html>
