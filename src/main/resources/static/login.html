<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Neighborhood Watch</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f172a, #1e3a5f);
        }

        .login-container {
            width: 400px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .logo {
            text-align: center;
            font-size: 42px;
            margin-bottom: 10px;
        }

        h1 {
            text-align: center;
            color: #0f172a;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #334155;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .message {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
        }

        .register-link {
            margin-top: 20px;
            text-align: center;
            color: #64748b;
        }

        .register-link a {
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }

        .register-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="logo">🏘️</div>

        <h1>Neighborhood Watch</h1>

        <p class="subtitle">
            Login to your account
        </p>

        <form id="loginForm">

            <div class="form-group">
                <label for="email">Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >
            </div>

            <button type="submit">
                Login
            </button>

        </form>

        <div id="message" class="message"></div>

        <div class="register-link">
            Don't have an account?
            <a href="register.html">Register here</a>
        </div>

    </div>


    <script>

        document
            .getElementById("loginForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();

                const email =
                    document.getElementById("email").value;

                const password =
                    document.getElementById("password").value;

                const message =
                    document.getElementById("message");

                message.textContent = "Logging in...";
                message.style.color = "#64748b";


                fetch("/users/login", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        email: email,
                        password: password
                    })

                })

                .then(async response => {

                    if (!response.ok) {

                        const errorText =
                            await response.text();

                        throw new Error(
                            errorText || "Login failed"
                        );
                    }

                    return response.json();
                })

                .then(user => {

                    /*
                     * Store basic user information
                     * for frontend UI purposes.
                     */

                    sessionStorage.setItem(
                        "userId",
                        user.userId
                    );

                    sessionStorage.setItem(
                        "userName",
                        user.fullName
                    );

                    sessionStorage.setItem(
                        "userEmail",
                        user.email
                    );

                    sessionStorage.setItem(
                        "userRole",
                        user.role
                    );


                    message.textContent =
                        "Login successful!";

                    message.style.color = "green";


                    setTimeout(function() {

                        window.location.href =
                            "incidents.html";

                    }, 500);

                })

                .catch(error => {

                    console.error(error);

                    message.textContent =
                        "Login failed. Please check your email and password.";

                    message.style.color = "red";
                });

            });

    </script>

</body>
</html>
