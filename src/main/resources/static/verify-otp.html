<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Verify Email - Neighborhood Watch</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f172a, #1e3a5f);
        }

        .container {
            width: 400px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .logo {
            text-align: center;
            font-size: 42px;
            margin-bottom: 10px;
        }

        h1 {
            text-align: center;
            color: #0f172a;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #334155;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .message {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
        }

        .login-link {
            margin-top: 20px;
            text-align: center;
            color: #64748b;
        }

        .login-link a {
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }

    </style>

</head>


<body>


<div class="container">

    <div class="logo">
        📧
    </div>

    <h1>
        Verify Your Email
    </h1>

    <p class="subtitle">
        Enter the 6-digit OTP sent to your email address.
    </p>


    <form id="verifyForm">


        <div class="form-group">

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

        </div>


        <div class="form-group">

            <label for="otp">
                OTP
            </label>

            <input
                type="text"
                id="otp"
                placeholder="Enter 6-digit OTP"
                maxlength="6"
                required
            >

        </div>


        <button type="submit">
            Verify Email
        </button>


    </form>


    <div id="message" class="message"></div>


    <div class="login-link">

        Already verified?

        <a href="login.html">
            Login
        </a>

    </div>


</div>


<script>


document
    .getElementById("verifyForm")
    .addEventListener("submit", function(event) {

        event.preventDefault();


        const email =
            document.getElementById("email").value;

        const otp =
            document.getElementById("otp").value;

        const message =
            document.getElementById("message");


        message.textContent =
            "Verifying...";

        message.style.color =
            "#64748b";


        fetch(
            `/users/verify-otp?email=${encodeURIComponent(email)}&otp=${encodeURIComponent(otp)}`,
            {
                method: "POST"
            }
        )

        .then(async response => {

            const text =
                await response.text();

            if (!response.ok) {

                throw new Error(
                    text || "Verification failed"
                );

            }

            return text;

        })

        .then(result => {

            message.textContent =
                result;

            message.style.color =
                "green";


            setTimeout(function() {

                window.location.href =
                    "login.html";

            }, 1500);

        })

        .catch(error => {

            console.error(error);

            message.textContent =
                error.message ||
                "Invalid or expired OTP";

            message.style.color =
                "red";

        });

    });


</script>


</body>

</html>
