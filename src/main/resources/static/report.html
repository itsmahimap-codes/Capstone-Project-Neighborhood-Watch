<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Report Incident - Neighborhood Watch</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">
            🛡️ Neighborhood Watch
        </a>

        <a href="incidents.html" class="btn btn-outline-light">
            View Incidents
        </a>
    </div>
</nav>

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-7">

            <div class="card shadow">

                <div class="card-body p-4">

                    <h2 class="text-center mb-4">
                        🚨 Report an Incident
                    </h2>

                    <p class="text-muted text-center">
                        Help keep your neighborhood safe by reporting an incident.
                    </p>

                    <form id="incidentForm">

                        <!-- Title -->
                        <div class="mb-3">
                            <label class="form-label">Incident Title</label>

                            <input
                                type="text"
                                id="title"
                                class="form-control"
                                placeholder="Example: Street light not working"
                                required>
                        </div>

                        <!-- Type -->
                        <div class="mb-3">
                            <label class="form-label">Incident Type</label>

                            <select id="incidentType" class="form-select" required>

                                <option value="">Select incident type</option>

                                <option value="Theft">Theft</option>
                                <option value="Accident">Accident</option>
                                <option value="Fire">Fire</option>
                                <option value="Suspicious Activity">
                                    Suspicious Activity
                                </option>
                                <option value="Public Safety">
                                    Public Safety
                                </option>
                                <option value="Other">Other</option>

                            </select>
                        </div>

                        <!-- Location -->
                        <div class="mb-3">
                            <label class="form-label">Location</label>

                            <input
                                type="text"
                                id="location"
                                class="form-control"
                                placeholder="Enter incident location"
                                required>
                        </div>

                        <!-- Description -->
                        <div class="mb-3">
                            <label class="form-label">Description</label>

                            <textarea
                                id="description"
                                class="form-control"
                                rows="5"
                                placeholder="Describe what happened..."
                                required></textarea>
                        </div>

                        <button
                            type="submit"
                            class="btn btn-danger w-100">

                            🚨 Submit Incident

                        </button>

                    </form>

                    <div id="message" class="mt-3"></div>

                </div>

            </div>

        </div>

    </div>

</div>


<script>

document.getElementById("incidentForm").addEventListener("submit", function(event) {

    event.preventDefault();

    const incident = {

        title: document.getElementById("title").value,

        description: document.getElementById("description").value,

        location: document.getElementById("location").value,

        incidentType: document.getElementById("incidentType").value

    };

    fetch("/incidents/report", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify(incident)

    })

    .then(response => {

        if (!response.ok) {
            throw new Error("Failed to report incident");
        }

        return response.json();

    })

    .then(data => {

        document.getElementById("message").innerHTML =
            '<div class="alert alert-success">' +
            '<strong>Incident reported successfully!</strong><br>' +
            'Your report has been submitted and is currently Pending.' +
            '</div>';

        document.getElementById("incidentForm").reset();

    })

    .catch(error => {

        document.getElementById("message").innerHTML =
            '<div class="alert alert-danger">' +
            'Unable to submit the incident. Please make sure the server is running.' +
            '</div>';

    });

});

</script>

</body>
</html>
